[build-system]
requires = [
    "setuptools>=61.0",
    "Cython>=3.0.10",
    "numpy>=2.0",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "PUCHIK"
version = '1.2.5'
#dynamic = ['version']
authors = [
    { name = "Hrachya Ishkhanyan", email = "hrachya.ishkhanyan@kcl.ac.uk" },
]
description = "Python Utility for Characterizing Heterogeneous Interfaces and Kinetics creates a grid from an molecular dynamics structure file. The system in question can have an arbitrary structure. Volume and species densities can then calculated."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",     # no <2 cap — the extension built per above runs on both
    "MDAnalysis>=2.8.0",
    "scipy>=1.14.0",
    "PyGEL3D",
    "python-dotenv",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
"Homepage" = "https://github.com/hrachishkhanyan/grid_project"
"Bug Tracker" = "https://github.com/hrachishkhanyan/grid_project/issues"

